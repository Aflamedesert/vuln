[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-scanner"
version = "0.1.0"
description = "Portfolio-grade Python network vulnerability scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5",
    "click>=8.1",
    "rich>=13.0",
    "packaging>=23.0",
    "jinja2>=3.1",
    "weasyprint>=60.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
vuln-scanner = "scanner.cli:cli"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20260408",
]
