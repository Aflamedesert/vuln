name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vuln-scanner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get install -y libpcap-dev

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ --cov=scanner --cov-report=xml -v

      - name: Coverage gate (>= 80%)
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          rate = float(root.get("line-rate", 0))
          print(f"Coverage: {rate * 100:.1f}%")
          if rate < 0.80:
              raise SystemExit(f"Coverage {rate * 100:.1f}% is below the 80% gate")
          EOF

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: vuln-scanner/coverage.xml
        if: always()
